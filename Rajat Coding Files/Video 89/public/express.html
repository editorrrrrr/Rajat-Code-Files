<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing POST Request</title>
</head>
<body>
    <script>
        async function testPort() {
            let a = await fetch("/",{method:"PUT"})
            let b = await a.text()
            console.log(b)
        }
        testPort()
    </script>
</body>
</html>
 <!-- this is a method to run the Post Request by HTML method,some steps
 first one is to create a public file in which we import index.html then will create an async await function then we will call it  -->
